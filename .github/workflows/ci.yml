name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders only — no real services are contacted.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations twice (checks idempotency)
        run: |
          PSQL="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $PSQL -f supabase/ci/supabase-stubs.sql
          for pass in 1 2; do
            for f in supabase/migrations/*.sql; do
              case "$f" in *20250607000000_initial_schema.sql|*20250607100000*|*20250608*|*20250609*) [ $pass = 2 ] && continue;; esac
              $PSQL -f "$f"
            done
          done
